[project]
name = "sp-solution-test-assignment"
version = "0.1.0"
description = "Autonomous browser agent test assignment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "openai==3.10.0",
  "pydantic==2.13.5",
  "playwright==1.62.0",
  "langsmith==0.12.2",
  "rich==15.0.0",
  "typer==0.27.2",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
browser-agent = "browser_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_agent", "evals"]

[tool.ruff]
target-version = "py312"
exclude = ["docs/research"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
