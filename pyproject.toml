[project]
name = "sp-solution-test-assignment"
version = "0.1.0"
description = "Autonomous browser agent test assignment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph==1.2.11",
  "openai==3.10.0",
  "pydantic==2.13.5",
  "langsmith==0.12.2",
  "rich==15.0.0",
  "typer==0.27.2",
  "python-dotenv>=1.0,<2",
  "prompt-toolkit>=3.0.52,<4",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
browser-agent = "browser_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_agent"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
